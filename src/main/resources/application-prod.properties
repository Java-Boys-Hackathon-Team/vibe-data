spring.datasource.url=${PG_DATASOURCE_URL}
spring.datasource.username=${PG_NAME}
spring.datasource.password=${PG_PASS}
spring.datasource.trino-local.url=${TRINO_JDBC_URL}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# Общий Redis защищён паролем.
spring.data.redis.password=${REDIS_PASSWORD:}

# Приложение стоит за обратным прокси, который терминирует TLS: без этого
# редиректы уводят с https на http.
server.forward-headers-strategy=framework

# Гистограмма по времени обработки запросов: без неё в Prometheus уезжают
# только сумма и количество, и квантили считать не из чего. Диапазон задаёт
# число корзин, а с ним и число рядов: быстрее 5 мс различать нечего, дольше
# 10 с - уже инцидент, а не разброс.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=5ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
