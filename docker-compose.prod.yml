name: vibe-data

# Продовый запуск на сервере: поднимается только само приложение.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# База, кэш, объектное хранилище, каталог Iceberg и Trino берутся из
# common-infra - общих сервисов сервера, к которым подключены все проекты.
# Поэтому docker-compose.yml здесь намеренно не подключается: описанные в нём
# postgres, pgadmin, minio, redis, iceberg-rest и trino нужны только для
# локальной разработки, где проект должен быть самодостаточным.
#
# Параметры подключения и токены лежат в .env.prod рядом с этим файлом,
# права 600, в репозиторий не коммитятся.

services:
  vibe-data:
    build: .
    container_name: vibe-data
    restart: always
    # Именно entrypoint, а не command: в образе задан ENTRYPOINT, и command стал
    # бы набором аргументов приложения, а не новой командой запуска.
    entrypoint: ["java", "-Dspring.config.additional-location=file:/app/config/application-prod.properties", "-jar", "/application/vibe-data.jar"]
    volumes:
      - './src/main/resources/application-prod.properties:/app/config/application-prod.properties'
    ports:
      # Порт слушается на хосте: reverse proxy ходит в приложение через него.
      - "8086:8080"
      # Служебный порт с метриками. Отдельный от прикладного намеренно: на
      # прикладном он был бы доступен снаружи через обратный прокси, и защита
      # держалась бы на одной строке его конфигурации. Наружу порт не
      # проброшен, метрики забирает Prometheus по локальной сети.
      - "9086:9086"
    env_file:
      - .env.prod
    environment:
      # Журнал в JSON: сборщик логов получает готовые поля - уровень, логгер,
      # сообщение, - и фильтр по уровню работает без разбора текста регулярками.
      # Переменной, а не свойством в коде: значение относится к среде запуска,
      # и пересобирать ради него образ незачем.
      - LOGGING_STRUCTURED_FORMAT_CONSOLE=logstash
      # Метрики приложения и JVM. Задаётся переменными, а не свойствами в коде:
      # зависимости уже собраны в образе, и пересобирать его незачем.
      - MANAGEMENT_SERVER_PORT=9086
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus,metrics
      # Без гистограммы в Prometheus уезжают только сумма и количество, и
      # квантили посчитать не из чего.
      - MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILES_HISTOGRAM_HTTP_SERVER_REQUESTS=true
      # Диапазон задаёт число корзин, а значит и число рядов. Крайние значения
      # выбраны по смыслу: быстрее 5 мс различать нечего, дольше 10 с - уже
      # инцидент, а не разброс.
      - MANAGEMENT_METRICS_DISTRIBUTION_MINIMUM_EXPECTED_VALUE_HTTP_SERVER_REQUESTS=5ms
      - MANAGEMENT_METRICS_DISTRIBUTION_MAXIMUM_EXPECTED_VALUE_HTTP_SERVER_REQUESTS=10s
      # Метка приложения на всех метриках: без неё ряды разных сервисов
      # различаются только адресом.
      - MANAGEMENT_METRICS_TAGS_APPLICATION=vibe-data
      - SPRING_PROFILES_ACTIVE=prod
      # За обратным прокси, который терминирует TLS.
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      # Без этого JVM считает доступной память всего сервера и берёт под кучу
      # четверть от неё, не замечая предела контейнера.
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60
    # Сервис без интерфейса и заметно легче остальных: предел ниже.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    networks: [common-infra]

networks:
  common-infra:
    # Сеть поднята проектом common-infra; здесь она только используется.
    external: true
